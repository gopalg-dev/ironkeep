name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type, lint, and design checks
        run: bun run check

      - name: Unit tests
        run: bun run test --runInBand

  android-preflight:
    name: Android release APK preflight
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the Android project
        run: bunx expo prebuild --platform android --no-install

      - name: Test native workout notification and widget controls
        working-directory: android
        run: ./gradlew :session-notification:testDebugUnitTest

      - name: Build the ARM64 release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a -Pironkeep.buildAbis=arm64-v8a

      - name: Confirm the release APK exists
        run: test -s android/app/build/outputs/apk/release/app-arm64-v8a-release.apk

      - name: Check release APK size and permissions
        run: bun run release:check

  ios-preflight:
    name: iOS simulator build preflight
    needs: quality
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the iOS project
        run: bunx expo prebuild --platform ios --no-install

      # Prebuild generates ios/ from the current Expo packages. Restoring an older
      # Pods tree or lockfile can pin incompatible local Expo podspec versions.
      - name: Cache CocoaPods downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-${{ runner.arch }}-cocoapods-downloads-v2-${{ hashFiles('bun.lock', 'package.json', 'app.json', 'app.config.ts', 'ios/Podfile') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cocoapods-downloads-v2-

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build the iOS simulator app
        run: >-
          xcodebuild -workspace ios/IronKeep.xcworkspace -scheme IronKeep
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
