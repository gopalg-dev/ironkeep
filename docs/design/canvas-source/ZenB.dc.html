<style>body{margin:0;background:#F6F6F4}a{color:inherit}a:hover{color:inherit}.pill{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex:1;min-height:76px;padding:8px 2px;border-radius:14px;background:#FFFFFF;font-variant-numeric:tabular-nums}.pill .n{font-size:12px;font-weight:600;color:#646971}.pill .v{font-size:14px;font-weight:700}.pill.done{background:#FFFFFF}.pill.done .v{color:#1F8A4C}.pill.cur{outline:2px solid #17191C;outline-offset:-2px}.pill.next .v{color:#646971;font-weight:500}.pill .l{font-size:12px;font-weight:500;color:#646971;font-variant-numeric:tabular-nums}.lp{display:flex;gap:6px}.lp i{flex:1;height:4px;border-radius:2px;background:#E3E3DF}.lp i.d{background:#1F8A4C}.lp i.c{background:#17191C}</style>
</helmet>

      <div class="hstack gap8">

      </div>
      <a href="Workout.dc.html" class="circ on-surface" aria-label="Exit zen"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></a>
    </div>
    <div class="lp mt16" aria-label="Lifts in this session"><i class="d"></i><i class="c"></i><i></i><i></i><i></i><i></i></div>
    <div class="hstack between mt20" style="align-items: center; margin-top: 20px">
      <div class="stack gap4">
        <span class="hstack gap8 sec num"><span class="dtile d-pull" aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px"><svg class="ic" viewBox="0 0 24 24" style="width: 16px; height: 16px"><path d="m7 6 5 5 5-5"/><path d="m7 13 5 5 5-5"/></svg></span>Pull A, lift 2 of 6</span>

    <div class="stack center gap8 mt8" style="background: var(--surface); border-radius: 16px; padding: 16px 16px 14px"><span class="cap">Reps, 6–10</span><div class="hstack" style="align-items: baseline"><span class="bignum num">10</span></div><div class="hstack gap8" style="width: 100%"><button class="btn btn-soft" style="flex: 1; height: 64px" aria-label="Less"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button><button class="btn btn-soft" style="flex: 1; height: 64px" aria-label="More"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button></div></div>
    <div class="cap num" style="text-align: center; margin-top: 12px">Last time 100 kg × 10, Oct 14</div>
  </div>
  <div class="bottom" style="gap: 8px">

    <div class="hstack between" style="padding-top: 4px">

      <a href="WorkoutSwap.dc.html" class="btn btn-surface sm" style="text-decoration: none"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3-4 4 4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></svg>Swap</a>

    </div>
  </div>
</div>
