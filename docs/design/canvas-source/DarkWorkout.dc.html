<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dark: workout</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./ik.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>body{margin:0;background:#121315}a{color:inherit}a:hover{color:inherit}</style>
</helmet>
<div class="screen dark with-tabs d-pull" style="font-family: 'Barlow', system-ui, sans-serif">
  <div class="content">
    <div class="topline">
      <div class="hstack gap8">
        <button class="circ on-surface" aria-label="Pause"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg></button>
        <span class="sec num">12 min</span>
      </div>
      <div class="hstack gap8">
        <a href="ZenB.dc.html" class="circ on-surface" aria-label="Zen mode"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2"/><circle cx="12" cy="12" r="3"/></svg></a>
        <button class="circ on-surface" aria-label="Session options"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg></button>
      </div>
    </div>
    <div class="titlerow mt8"><span class="dtile lg d-pull" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24"><path d="m7 6 5 5 5-5"/><path d="m7 13 5 5 5-5"/></svg></span><h1 class="title">Pull A</h1></div>
    <div class="group mt24">
      <div class="row tall"><img class="thumb" src="/_blob/36f67211b83724d979bbdc985251c74a" alt=""><div class="grow"><div class="rt">Pull-ups</div><div class="rs">4 × 6–12</div></div><span class="rv num ok-c hstack gap4">4/4 <svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg></span></div>
    </div>
    <div class="group mt8">
      <div class="row tall"><img class="thumb" src="/_blob/e147e36b534d45597be6e070579ca1b5" alt=""><div class="grow"><div class="rt">Barbell Row</div><div class="rs">4 × 6–10</div></div><span class="rv num">1/4</span><svg class="ic muted" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></div>
      <div style="padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px">
        <div class="cap num">Last time 60 kg × 10, 10, 9, 8</div>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
          <div class="stack center gap8" style="background: var(--bg); border-radius: 16px; padding: 12px 8px 12px">
            <span class="cap">Weight</span>
            <div class="hstack" style="align-items: baseline"><span class="bignum num" style="font-size: 48px">62.5</span><span class="unit">kg</span></div>
            <div class="hstack gap12">
              <button class="circ on-surface" aria-label="Less weight"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
              <button class="circ on-surface" aria-label="More weight"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
            </div>
          </div>
          <div class="stack center gap8" style="background: var(--bg); border-radius: 16px; padding: 12px 8px 12px">
            <span class="cap">Reps</span>
            <div class="hstack" style="align-items: baseline"><span class="bignum num" style="font-size: 48px">10</span></div>
            <div class="hstack gap12">
              <button class="circ on-surface" aria-label="Fewer reps"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
              <button class="circ on-surface" aria-label="More reps"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
            </div>
          </div>
        </div>
        <button class="btn btn-ink">Set 2 done</button>
        <div class="hstack between">
          <div class="sdots" aria-label="Sets"><span class="sd done"></span><span class="sd cur"></span><span class="sd"></span><span class="sd"></span></div>
          <div class="hstack gap8">
            <button class="circ" aria-label="Add a set"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14"/></svg></button>
            <a href="WorkoutSwap.dc.html" class="circ" aria-label="Swap lift" style="text-decoration: none"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3-4 4 4 4M4 7h16M16 21l4-4-4-4M20 17H4"/></svg></a>
          </div>
        </div>
      </div>
    </div>
    <div class="group mt8">
      <div class="row tall"><img class="thumb" src="/_blob/cc7f3044010caa1f423db4d23fa26dab" alt=""><div class="grow"><div class="rt">Seated Cable Row</div><div class="rs">3 × 8–12</div></div><span class="rv num">0/3</span><svg class="ic muted" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
      <div class="row tall"><img class="thumb" src="/_blob/d2278e993d1b4d45b7415ff03e276116" alt=""><div class="grow"><div class="rt">Face Pull</div><div class="rs">3 × 12–15</div></div><span class="rv num">0/3</span><svg class="ic muted" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></div>
    </div>
  </div>
  <div class="footer row-f">
    <span class="sec num">5 of 20 sets done</span>
    <a href="WorkoutFinish.dc.html" class="btn btn-ink sm" style="text-decoration: none"><svg class="ic sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/></svg>Finish workout</a>
  </div>
  <nav class="tabbar" aria-label="Main">
    <a class="tab on" href="DarkToday.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.409 13.017A5 5 0 0 1 22 15c0 3.866-4 7-9 7-4.077 0-8.153-.82-10.371-2.462-.426-.316-.631-.832-.62-1.362C2.118 12.723 2.627 2 10 2a3 3 0 0 1 3 3 2 2 0 0 1-2 2c-1.105 0-1.64-.444-2-1"/><path d="M15 14a5 5 0 0 0-7.584 2"/><path d="M9.964 6.825C8.019 7.977 9.5 13 8 15"/></svg>Today</a>
    <a class="tab" href="DarkPlan.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/><path d="m3 17 2 2 4-4"/><rect x="3" y="4" width="6" height="6" rx="1"/></svg>Plan</a>
    <a class="tab" href="DarkStatsLifts.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21v-6"/><path d="M12 21V3"/><path d="M19 21V9"/></svg>Stats</a>
    <a class="tab" href="Menu.dc.html"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>Menu</a>
  </nav>
</div>
</x-dc>
