<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dark: active workout notification</title>
<style>
/* Android system surface: colours and type follow System UI, independently of the app look.
   Runtime source: modules/session-notification/android/src/main/res/layout/session_notification.xml. */
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;padding:24px 16px;font:14px Arial,sans-serif;color:CanvasText;background:Canvas;width:390px;min-height:660px}
article{border:1px solid GrayText;border-radius:24px;padding:16px;margin:0 0 24px;background:Field}
header{font-size:12px;margin-bottom:16px;display:flex;gap:8px;align-items:center}header time{margin-left:auto}h1{font-size:16px;line-height:20px;margin:0 0 4px}p{margin:0;line-height:20px;font-size:13px}
.step{height:48px;display:flex;align-items:center;justify-content:space-between}.step span{text-align:center;font-size:16px}.actions{display:flex;height:48px;margin-top:4px}button{border:0;background:transparent;color:CanvasText;font:inherit;min-height:48px;min-width:48px;padding:0 8px}.actions button{flex:1}.actions .done{flex:1.5;font-weight:bold}.sub{margin-bottom:4px}.phase{font-size:12px;margin:0 0 8px;color:GrayText}
</style>
</head>
<body>
<article aria-label="Collapsed notification">
  <header><b>IronKeep</b><span>Pull A</span><time>12:08</time></header>
  <h1>Barbell Row</h1><p>Set 2 of 4 · 5 of 20 sets done</p>
</article>
<article aria-label="Expanded notification">
  <header><b>IronKeep</b><span>Pull A</span><time>12:08</time></header>
  <h1>Barbell Row</h1><p class="sub">Set 2 of 4 · 5 of 20 sets done</p>
  <div class="step"><button aria-label="Decrease weight">−</button><span>60 kg</span><button aria-label="Increase weight">+</button></div>
  <div class="step"><button aria-label="Decrease reps">−</button><span>8 reps</span><button aria-label="Increase reps">+</button></div>
  <div class="actions"><button>Pause</button><button class="done">Set 2 done</button><button>Finish</button></div>
</article>
<article aria-label="All sets logged">
  <header><b>IronKeep</b><span>Pull A</span><time>42:16</time></header>
  <h1>All sets logged</h1><p>20 of 20 sets done</p>
  <div class="actions"><button>Pause</button><button class="done">Finish workout</button></div>
</article>
</body>
</html>
