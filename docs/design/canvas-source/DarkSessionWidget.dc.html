<html lang="en"><head><meta charset="utf-8"><title>Workout widget · Twin tiles</title><link rel="stylesheet" href="./ik.css"><style>body{margin:0}.screen{padding:16px;gap:24px;font-family:Arial,sans-serif}.widget{height:224px;border-radius:24px;background:var(--surface);padding:10px;display:flex;flex-direction:column}.meta,.title{display:flex;align-items:center;justify-content:space-between;gap:4px}.meta{font-size:12px;color:var(--muted);line-height:14px}.lift{font:700 22px/26px 'Arial Narrow',Arial,sans-serif;margin:0}.title{font-size:22px;line-height:26px}.clock{font-size:12px}.controls{margin-top:4px;display:flex;flex:1;flex-direction:column;min-height:0}.tiles{display:flex;gap:8px;flex:1;min-height:0}.tile{flex:1;border-radius:20px;background:var(--surface-2);padding:6px;display:flex;flex-direction:column;min-width:0}.tile label{line-height:14px;font-size:12px;color:var(--muted)}.value{font:700 28px 'Arial Narrow',Arial,sans-serif;flex:1;display:flex;align-items:center}.pair{display:flex;gap:4px}.pair button{flex:1;background:var(--surface);font-size:24px}.actions{display:flex;gap:4px;margin-top:4px}button{border:0;border-radius:14px;background:var(--surface-2);color:var(--fg);height:48px;min-width:48px;font:14px Arial,sans-serif}.actions button{flex:1}.actions .done{flex:1.4;background:var(--fg);color:var(--bg)}button:disabled{opacity:.4}.card{height:104px;padding:12px;flex-direction:row;align-items:center;gap:8px}.card header{flex:1;min-width:0}.card .lift{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card button{display:grid;place-items:center}.card svg{width:24px;height:24px}.tall{height:344px}.strip{height:48px;padding:0 12px}</style></head><body><main class="screen dark"><article class="widget " aria-label="Active"><header><div class="meta"><span>Legs A</span><span>1 of 7 sets done</span></div><div class="title"><h1 class="lift">Leg curl</h1><span class="clock">1:24 since set</span></div></header><div class="controls"><div class
