<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workout widget</title><link rel="stylesheet" href="./ik.css"><style>body{margin:0}.screen{padding:16px;gap:24px;font-family:Arial,sans-serif}.widget{height:220px;border-radius:24px;background:var(--surface);padding:10px;display:flex;flex-direction:column}.meta,.title{display:flex;align-items:center;gap:4px;justify-content:space-between}.day,.progress{font-size:12px;color:var(--muted);line-height:14px}.lift{font:700 22px/26px 'Arial Narrow',Arial,sans-serif;margin:0}.clock{font-size:12px;line-height:20px}.controls{margin-top:4px;display:flex;flex-direction:column;gap:4px}.step,.secondary{display:flex;gap:4px;height:48px;align-items:center}.step span{flex:1;text-align:center;font:700 22px/26px 'Arial Narrow',Arial,sans-serif}button{border:0;border-radius:12px;background:var(--surface-2);color:var(--fg);font:14px Arial,sans-serif;height:48px;min-width:48px}.step button{font-size:24px}.secondary button{flex:1}.secondary .done{flex:1.4;background:var(--fg);color:var(--bg)}button:disabled{opacity:.4}.open{margin-top:12px;width:100%}.card{height:auto;min-height:80px;padding:12px;flex-direction:row;align-items:center;gap:8px}.card header{flex:1;min-width:0}.card .lift{font-size:20px;line-height:24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card button{width:48px;flex-shrink:0;display:flex;align-items:center;justify-content:center}.card button svg{width:24px;height:24px}.title .clock{font-weight:normal}.one-row{height:104px}.strip{height:48px;min-height:48px;padding:0 12px}</style></head><body><main class="screen dark"><article class="widget" aria-label="Active"><header><div class="meta"><div class="day">Legs A</div><div class="progress">1 of 7 sets done</div></div><div class="title"><h1 class="lift">Leg curl</h1><div class="clock">1:24 since set</div></div></header><div class="controls"><div class="step"><button aria-label="Decrease weight">&minus;</button><span>25 kg</span><button aria-label="Increase weight">+</button></div><div class="step"><button aria-label="Decrease reps">&minus;</button><span>15 reps</span><button aria-label="Increase reps">+</button></div><div class="secondary"><button>+ Set</button><button>Pause</button><button class="done" aria-label="Set 2 of 3 done">Done 2/3</button></div></div></article><article class="widget" aria-label="Paused"><header><div class="meta"><div class="day">Legs A &middot; Paused</div><div class="progress">1 of 7 sets done</div></div><div class="title"><h1 class="lift">Leg curl</h1><div class="clock">1:24 since set</div></div></header><div class="controls"><div class="step"><button aria-label="Decrease weight" disabled>&minus;</button><span>25 kg</span><button aria-label="Increase weight" disabled>+</button></div><div class="step"><button aria-label="Decrease reps" disabled>&minus;</button><span>15 reps</span><button aria-label="Increase reps" disabled>+</button></div><div class="secondary"><button disabled>+ Set</button><button>Resume</button><button class="done" aria-label="Set 2 of 3 done" disabled>Done 2/3</button></div></div></article><article class="widget card" aria-label="Completed"><header><h1 class="lift">All sets logged</h1><div class="day">7 of 7 sets done</div></header><button aria-label="Open session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button></article><article class="widget card" aria-label="Idle"><header><h1 class="lift">IronKeep</h1><div class="day">No active session</div></header><button aria-label="Open IronKeep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button></article><article class="widget card one-row" aria-label="Compact"><header><h1 class="lift">Leg curl</h1><div class="day">Legs A</div></header><button aria-label="Open session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button></article><article class="widget card strip" aria-label="One-row landscape"><header><h1 class="lift">IronKeep</h1></header><button aria-label="Open IronKeep"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M12 5l7 7-7 7"/></svg></button></article></main></body></html>
